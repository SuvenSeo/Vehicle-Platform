# fly.toml app configuration file generated for vehicle-platform-backend on 2026-04-16T13:27:03+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vehicle-platform-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOW_SQLITE_FALLBACK = 'false'
  # Scraping is handled entirely by GitHub Actions (Playwright not installed in this image)
  DAILY_SYNC_ENABLED = 'false'
  DAILY_SYNC_RUN_ON_STARTUP = 'false'
  PORT = '8080'
  # Database: set COLD_DATABASE_URL as a fly secret (flyctl secrets set COLD_DATABASE_URL=...)
  # DATABASE_URL and HOT_DATABASE_URL are no longer needed

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
