<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motormila — The fair mila for every motor.</title>
    <meta
      name="description"
      content="Motormila tracks Sri Lankan vehicle listings, price trends, district coverage, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta name="author" content="Motormila" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <script>
      /* Pre-paint theme bootstrap — applies the saved/default theme before
         first paint so there is no flash of the wrong palette. Dark is default. */
      (function () {
        try {
          var mode = localStorage.getItem("autolens_theme_mode") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "theme-dark" : "theme-light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://motormila.vercel.app/" />
    <meta property="og:title" content="Motormila — Vehicle Intelligence for Sri Lanka" />
    <meta
      property="og:description"
      content="Track Sri Lankan vehicle prices, trends, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://motormila.vercel.app/" />

    <meta property="og:image:width" content="1200" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    <link rel="preload" href="/logo-mark.png" as="image" type="image/png" />
    <script>
      /* Recover from stale deploys where /assets/*.css 404s were rewritten to index.html,
         which leaves the app rendered with zero styles until a hard refresh. */
      (function () {
        var CSS_RELOAD_KEY = "motormila.css_reload_attempted";
        var CSS_RELOAD_KEY_LEGACY = "autolens.css_reload_attempted";
        var CSS_RELOAD_TTL_MS = 30000;

        function canReload() {
          try {
            var raw =
              sessionStorage.getItem(CSS_RELOAD_KEY) ||
              sessionStorage.getItem(CSS_RELOAD_KEY_LEGACY);
            if (!raw) return true;
            var stamped = Number(raw);
            if (!isFinite(stamped)) return false;
            return Date.now() - stamped > CSS_RELOAD_TTL_MS;
          } catch (e) {
            return true;
          }
        }

        function reloadOnce() {
          if (!canReload()) return;
          try {
            sessionStorage.setItem(CSS_RELOAD_KEY, String(Date.now()));
          } catch (e) {
            return;
          }
          location.reload();
        }

        function looksLikeHtml(text) {
          var head = String(text || "").slice(0, 200).toLowerCase();
          return head.indexOf("<!doctype") !== -1 || head.indexOf("<html") !== -1;
        }

        window.addEventListener("load", function () {
          var links = document.querySelectorAll('link[rel="stylesheet"][href*="/assets/"]');
          if (!links.length) return;

          links.forEach(function (link) {
            fetch(link.href, { cache: "reload" })
              .then(function (res) {
                if (!res.ok) {
                  reloadOnce();
                  return null;
                }
                return res.text();
              })
              .then(function (body) {
                if (body == null) return;
                if (looksLikeHtml(body)) reloadOnce();
              })
              .catch(function () {
                reloadOnce();
              });
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
