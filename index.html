    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <script>
      /* Pre-paint theme bootstrap — applies the saved/default theme before
         first paint so there is no flash of the wrong palette. Dark is default. */
      (function () {
        try {
          var mode = localStorage.getItem("autolens_theme_mode") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "theme-dark" : "theme-light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
