# SCHEDULE PAUSED 2026-07-29 — Supabase free egress exceeded. Manual workflow_dispatch only until quota resets / snapshots enabled.
# Health probes hit the /health endpoint which internally touches the DB; pausing to avoid contributing to egress while quota is exceeded.
# Ping the Hugging Face Spaces API every 10 minutes so free-tier
# cold starts don't leave the first user waiting 10–20s.
name: Keep HF Space Awake

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Health ping
        run: |
          set -euo pipefail
          url="https://seo292-vehicle-platform-backend.hf.space/health"
          echo "Pinging ${url}"
          # Retry a few times — Spaces can briefly refuse during redeploys.
          for i in 1 2 3; do
            if curl -fsS --max-time 25 "${url}"; then
              echo
              echo "OK (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i} failed; retrying…"
            sleep 5
          done
          # Scheduled keep-alives should not fail the Actions dashboard when
          # HF is briefly down; exit 0 so the next tick can try again.
          echo "Health ping failed after retries (non-blocking)"
          exit 0
