# Ping the Hugging Face Spaces API every 10 minutes so free-tier
# cold starts don't leave the first user waiting 10–20s.
name: Keep HF Space Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Health ping
        env:
          HF_HEALTH_URL: ${{ vars.HF_HEALTH_URL || 'https://seo292-vehicle-platform-backend.hf.space/health' }}
        run: |
          set -euo pipefail
          url="${HF_HEALTH_URL}"
          echo "Pinging ${url}"
          # Retry a few times — Spaces can briefly refuse during redeploys.
          for i in 1 2 3; do
            if curl -fsS --max-time 25 "${url}"; then
              echo
              echo "OK (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i} failed; retrying…"
            sleep 5
          done
          echo "Health ping failed after retries (non-blocking for schedule)"
          exit 0
