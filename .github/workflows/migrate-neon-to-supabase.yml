name: Migrate Neon → Supabase

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export all tables from Neon
        env:
          SOURCE_DATABASE_URL: ${{ secrets.COLD_DATABASE_URL }}
        run: |
          python rescue_postgres_data.py export --output rescue_exports/migration
          echo "--- manifest ---"
          cat rescue_exports/migration/manifest.json


      - name: Build Supabase pooler URL (IPv4-safe for GitHub Actions)
        env:
          DIRECT_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          python -c "
          import os, re
          url = os.environ['DIRECT_URL'].strip()
          if url.startswith('postgres://'):
              url = 'postgresql://' + url[len('postgres://'):]
          # Extract project ref from db.PROJECT_REF.supabase.co
          m = re.search(r'@db\.([^.]+)\.supabase\.co', url)
          if not m:
              print(f'POOLER_URL={url}')
          else:
              ref = m.group(1)
              # Replace direct host with pooler host, user postgres -> postgres.REF
              pooler = re.sub(r'(postgresql://)(postgres)(:)', rf'\1postgres.{ref}\3', url)
              pooler = re.sub(r'@db\.[^.]+\.supabase\.co(:\d+)?', '@aws-0-ap-southeast-1.pooler.supabase.com:5432', pooler)
              print(f'POOLER_URL={pooler}')
          " >> $GITHUB_ENV

      - name: Recreate schema on Supabase (drop + create for clean slate)
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          url = os.environ['POOLER_URL']
          from sqlalchemy import create_engine
          from db.models import Base
          engine = create_engine(url, pool_pre_ping=True)
          Base.metadata.drop_all(bind=engine)
          print('Dropped existing tables.')
          Base.metadata.create_all(bind=engine)
          print('Schema recreated on Supabase.')
          engine.dispose()
          "

      - name: Import into Supabase
        run: |
          TARGET_DATABASE_URL=$POOLER_URL \
          python rescue_postgres_data.py import \
            --input rescue_exports/migration \
            --replace

      - name: Verify row counts on Supabase
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['POOLER_URL'], connect_timeout=15)
          cur = conn.cursor()
          for t in ['car_listings', 'raw_listings', 'price_aggregates', 'market_signals', 'locations', 'scrape_runs']:
              try:
                  cur.execute(f'SELECT COUNT(*) FROM {t}')
                  print(f'{t}: {cur.fetchone()[0]:,} rows')
              except Exception as e:
                  print(f'{t}: skip ({e})')
          conn.close()
          "

      - name: Upload export as backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-migration-export-${{ github.run_id }}
          path: backend/rescue_exports/migration
          retention-days: 30
