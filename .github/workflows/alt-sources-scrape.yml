name: Alternate Sources Scraper

# Manual trigger only — all sources (including these) are in daily-scrape.yml
# Use this only for ad-hoc runs of alt sources in isolation.
on:
  workflow_dispatch:

jobs:
  scrape-alt-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max per job
    strategy:
      fail-fast: false
      matrix:
        source: [autolanka, auto-lanka, autodirect, autostream, patpat, carshop, saleme, riyahub, dimo]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/autolanka.py \
            app/scrapers/auto_lanka_site.py \
            app/scrapers/autodirect.py \
            app/scrapers/autostream.py \
            app/scrapers/patpat.py \
            app/scrapers/generic_detail.py \
            app/scrapers/carshop.py \
            app/scrapers/saleme.py \
            app/scrapers/riyahub.py \
            app/scrapers/dimo.py \
            app/services/market_signals.py \
            app/services/aggregator.py

      - name: Ensure NeonDB schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.COLD_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        env:
          COLD_DATABASE_URL: ${{ secrets.COLD_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "alt"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          # Rescue-safe manual default. Raise only for an intentional full scan.
          SCRAPE_MAX_PAGES: "20"
          SCRAPE_MAX_PAGES_ALT: "20"
          SCRAPE_MAX_PAGES_PATPAT: "20"
          SCRAPE_MAX_PAGES_AUTOLANKA: "20"
          SCRAPE_MAX_PAGES_AUTO_LANKA_SITE: "20"
          SCRAPE_MAX_PAGES_AUTODIRECT: "20"
          SCRAPE_MAX_PAGES_AUTOSTREAM: "20"
          SCRAPE_MAX_PAGES_CARSHOP: "20"
          SCRAPE_MAX_PAGES_SALEME: "20"
          SCRAPE_MAX_PAGES_RIYAHUB: "20"
          SCRAPE_MAX_PAGES_DIMO: "20"
          # 6 hours timeout per source (21600s)
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_ALT: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_PATPAT: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOLANKA: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTO_LANKA_SITE: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTODIRECT: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOSTREAM: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARSHOP: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_SALEME: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYAHUB: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_DIMO: "21600"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alt-scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7
