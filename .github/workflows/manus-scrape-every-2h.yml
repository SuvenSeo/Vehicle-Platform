name: Manus Scrape Dump (3x Daily)

on:
  schedule:
    # Runs at 07:30, 15:30, and 23:30 Sri Lanka Time (02:00, 10:00, 18:00 UTC).
    # 3x daily with an incremental page budget prevents IP blocks and avoids
    # redundant scrapes while capturing fresh listings cleanly.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A delayed run queues instead of cancelling an active scrape, preventing
# competing SQLite dumps and duplicate source traffic.
concurrency:
  group: manus-scrape-dump-cadence
  cancel-in-progress: false

jobs:
  scrape-and-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      MANUS_MAX_PAGES: "30"
      # Each source is bounded so a blocked marketplace cannot prevent later
      # sources or the dump upload from running.
      MANUS_SOURCE_TIMEOUT_SECONDS: "600"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Scrape sources and upload dump
        run: |
          bash backend/scripts/ops/manus_scrape_dump.sh \
            ikman autolanka hitad autostream saleme riyahub carshop dimo autodirect cartivate

      - name: Upload local dump if delivery failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manus-scrape-failure-${{ github.run_id }}
          path: backend/autolens.db.gz
          if-no-files-found: ignore
          retention-days: 7
