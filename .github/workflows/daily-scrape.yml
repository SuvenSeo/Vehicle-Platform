name: Unified Vehicle Scraper

on:
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC daily (7:30 AM Sri Lanka time)
  workflow_dispatch:

jobs:
  scrape-source:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max per job
    strategy:
      fail-fast: false
      matrix:
        source: [ikman, riyasewana, patpat, autolanka, auto-lanka, autodirect, autostream, carshop, saleme, riyahub, dimo]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/ikman.py \
            app/scrapers/riyasewana.py \
            app/scrapers/patpat.py \
            app/scrapers/autolanka.py \
            app/scrapers/auto_lanka_site.py \
            app/scrapers/autodirect.py \
            app/scrapers/autostream.py \
            app/scrapers/generic_detail.py \
            app/scrapers/carshop.py \
            app/scrapers/saleme.py \
            app/scrapers/riyahub.py \
            app/scrapers/dimo.py \
            app/services/market_signals.py \
            app/services/aggregator.py

      - name: Ensure schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          # Rescue-safe manual default. Use a separate full-refresh workflow if
          # a deeper scan is needed after the Supabase migration.
          SCRAPE_MAX_PAGES: "20"
          SCRAPE_MAX_PAGES_ALT: "20"
          SCRAPE_MAX_PAGES_IKMAN: "20"
          SCRAPE_MAX_PAGES_RIYASEWANA: "20"
          SCRAPE_MAX_PAGES_PATPAT: "20"
          SCRAPE_MAX_PAGES_AUTOLANKA: "20"
          SCRAPE_MAX_PAGES_AUTO_LANKA_SITE: "20"
          SCRAPE_MAX_PAGES_AUTODIRECT: "20"
          SCRAPE_MAX_PAGES_AUTOSTREAM: "20"
          SCRAPE_MAX_PAGES_CARSHOP: "20"
          SCRAPE_MAX_PAGES_SALEME: "20"
          SCRAPE_MAX_PAGES_RIYAHUB: "20"
          SCRAPE_MAX_PAGES_DIMO: "20"
          # 6 hours timeout per source (21600s)
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_ALT: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_IKMAN: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_PATPAT: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOLANKA: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTO_LANKA_SITE: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTODIRECT: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOSTREAM: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARSHOP: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_SALEME: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYAHUB: "21600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_DIMO: "21600"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7

  market-analysis:
    runs-on: ubuntu-latest
    needs: scrape-source
    if: ${{ always() }}
    timeout-minutes: 90

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market analysis once
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "true"
          RUN_MARKET_SIGNALS: "true"
        run: python run_sync.py

  snapshot-export:
    runs-on: ubuntu-latest
    needs: [scrape-source, market-analysis]
    if: ${{ always() }}
    timeout-minutes: 90

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Export public snapshots
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python export_public_snapshots.py --output snapshots/latest

      - name: Upload snapshots to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: snapshots/latest
        run: python upload_snapshots_r2.py

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-snapshot-manifest-${{ github.run_id }}
          path: backend/snapshots/latest/manifest.json
          retention-days: 14
