# Neon-first: scrapers WRITE to NeonDB (ingress is free). Public reads stay on
# R2 snapshots (VITE_SNAPSHOT_ONLY=true) so DB egress stays flat.
# Daily runs export stats-only snapshots; the full catalog refreshes weekly
# via "Scrape → Export → Redeploy" (see docs/neon-egress-budget.md).
name: Unified Vehicle Scraper

on:
  schedule:
    # 07:30 and 18:10 Sri Lanka time = 02:00 and 12:40 UTC
    - cron: "0 2 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:

# Separate group from midday so the two workflows never cancel each other.
# Keep cancel-in-progress false so a delayed morning run is not killed by evening.
concurrency:
  group: scrape-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-source:
    runs-on: ubuntu-latest
    # Heavy sources need setup (~10m) + scrape headroom. Lighter sources finish sooner.
    timeout-minutes: ${{ contains(fromJSON('["ikman","riyasewana"]'), matrix.source) && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        source: [ikman, riyasewana, patpat, autolanka, auto-lanka, autodirect, autostream, carshop, saleme, riyahub, dimo, hitad, cartivate]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/ikman.py \
            app/scrapers/riyasewana.py \
            app/scrapers/patpat.py \
            app/scrapers/autolanka.py \
            app/scrapers/auto_lanka_site.py \
            app/scrapers/autodirect.py \
            app/scrapers/autostream.py \
            app/scrapers/generic_detail.py \
            app/scrapers/carshop.py \
            app/scrapers/saleme.py \
            app/scrapers/riyahub.py \
            app/scrapers/dimo.py \
            app/scrapers/hitad.py \
            app/scrapers/cartivate.py \
            app/services/market_signals.py \
            app/services/aggregator.py

      - name: Ensure schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          # Lifecycle + outlier passes run once in the market-analysis job,
          # not in each of the parallel scrape jobs.
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          # Rescue-safe manual default. Use a separate full-refresh workflow if
          # a deeper scan is needed after the Supabase migration.
          SCRAPE_MAX_PAGES: "20"
          SCRAPE_MAX_PAGES_ALT: "20"
          # Cap heavy sources so Playwright fallback can finish inside job timeout.
          # API mode still covers recent inventory well at 60 pages.
          SCRAPE_MAX_PAGES_IKMAN: "60"
          SCRAPE_MAX_PAGES_RIYASEWANA: "60"
          SCRAPE_MAX_PAGES_PATPAT: "20"
          SCRAPE_MAX_PAGES_AUTOLANKA: "20"
          SCRAPE_MAX_PAGES_AUTO_LANKA_SITE: "20"
          SCRAPE_MAX_PAGES_AUTODIRECT: "20"
          SCRAPE_MAX_PAGES_AUTOSTREAM: "20"
          SCRAPE_MAX_PAGES_CARSHOP: "20"
          SCRAPE_MAX_PAGES_SALEME: "20"
          SCRAPE_MAX_PAGES_RIYAHUB: "20"
          SCRAPE_MAX_PAGES_DIMO: "20"
          SCRAPE_MAX_PAGES_HITAD: "20"
          SCRAPE_MAX_PAGES_CARTIVATE: "20"
          # Source timeouts must stay below job timeout minus setup (~10m).
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_ALT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_IKMAN: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_PATPAT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOLANKA: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTO_LANKA_SITE: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTODIRECT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOSTREAM: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARSHOP: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_SALEME: "2700"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYAHUB: "2700"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_DIMO: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_HITAD: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARTIVATE: "2400"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' (${{ matrix.source }}) failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  market-analysis:
    runs-on: ubuntu-latest
    needs: scrape-source
    if: ${{ !cancelled() }}
    # First pass after a migration/dedup rebuild is heavy (deal scores,
    # lifecycle, outlier, thumbnail/phash backfill over the full table).
    timeout-minutes: 180

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market analysis once
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "true"
          RUN_MARKET_SIGNALS: "true"
          RUN_DEAL_SCORE_REFRESH: "true"
          RUN_STATS_CACHE_REFRESH: "true"
          RUN_DEDUP: "true"
          RUN_LISTING_LIFECYCLE: "true"
          RUN_OUTLIER_DETECTION: "true"
          RUN_PRICE_RECOVERY: "true"
          RUN_ALERT_MATCH: "true"
          RUN_THUMBNAIL_CACHE: "true"
          RUN_IMAGE_PHASH: "true"
        run: python run_sync.py

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  snapshot-export:
    runs-on: ubuntu-latest
    needs: [scrape-source, market-analysis]
    if: ${{ !cancelled() && needs.market-analysis.result == 'success' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Export public snapshots (stats-only — catalog refreshes weekly)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python export_public_snapshots.py --output snapshots/latest --skip-catalog

      - name: Upload snapshots to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: snapshots/latest
        run: python upload_snapshots_r2.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy snapshots to Vercel production
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: backend/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-snapshot-manifest-${{ github.run_id }}
          path: backend/snapshots/latest/manifest.json
          retention-days: 14

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"
