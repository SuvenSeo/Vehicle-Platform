name: Historical Data Backfill

# Seeds DMT/policy market_signals, imports the staged Kaggle SL vehicle CSV into
# historical_price_observations (NOT live car_listings), and rate-limits a dense
# Wayback Machine backfill (ikman brands/models/category + riyasewana SERPs).
#
# Trigger: Actions → Historical Data Backfill → Run workflow

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Seed DMT + policy market_signals"
        type: boolean
        default: true
      run_csv_import:
        description: "Import Kaggle SL CSV into historical_price_observations"
        type: boolean
        default: true
      run_community_csv:
        description: "Also import community riyasewana-derived CSV (archive only)"
        type: boolean
        default: true
      run_wayback:
        description: "Wayback dense archive backfill"
        type: boolean
        default: true
      wayback_profile:
        description: "SERP profile: dense | brands | extended | models | all"
        type: string
        default: "dense"
      wayback_max_snapshots_per_url:
        description: "Max monthly CDX hits kept per SERP URL"
        type: number
        default: 30
      wayback_max_snapshots:
        description: "Optional global snapshot cap (0 = no global cap)"
        type: number
        default: 600
      wayback_sleep:
        description: "Seconds between Wayback HTML fetches"
        type: number
        default: 1.5
      include_riyasewana:
        description: "Include riyasewana.com SERPs in dense profile"
        type: boolean
        default: true

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure schema
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python - <<'PY'
          from db.session import init_db
          init_db()
          print("schema_ok")
          PY

      - name: Seed DMT + policy context
        if: ${{ inputs.run_seed }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python scripts/ops/seed_market_context.py

      - name: Import Kaggle SL CSV → historical_price_observations only
        if: ${{ inputs.run_csv_import }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          test -f data/historical/kaggle_sl_car_price_dataset.csv
          wc -l data/historical/kaggle_sl_car_price_dataset.csv
          python scripts/ops/import_historical_csv.py \
            data/historical/kaggle_sl_car_price_dataset.csv \
            --archive-source kaggle_sl \
            --price-unit lakhs \
            --observed-default 2025-01-15

      - name: Import community SL CSV → historical_price_observations only
        if: ${{ inputs.run_community_csv }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          mkdir -p /tmp/historical_seed
          curl -fsSL \
            "https://raw.githubusercontent.com/manojtharindu11/srilankan-used-car-price-predictor/main/collect%20data/data/sri_lankan_vehicles.csv" \
            -o /tmp/historical_seed/sri_lankan_vehicles.csv
          wc -l /tmp/historical_seed/sri_lankan_vehicles.csv
          python scripts/ops/import_historical_csv.py \
            /tmp/historical_seed/sri_lankan_vehicles.csv \
            --archive-source community_csv_riyasewana \
            --observed-default 2026-02-20

      - name: Wayback dense backfill
        if: ${{ inputs.run_wayback }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          RIYA_FLAG="--include-riyasewana"
          if [ "${{ inputs.include_riyasewana }}" != "true" ]; then
            RIYA_FLAG="--no-include-riyasewana"
          fi
          python scripts/ops/backfill_wayback_prices.py \
            --profile "${{ inputs.wayback_profile }}" \
            $RIYA_FLAG \
            --from 20170101 \
            --to 20261231 \
            --max-snapshots-per-url "${{ inputs.wayback_max_snapshots_per_url }}" \
            --max-snapshots "${{ inputs.wayback_max_snapshots }}" \
            --sleep "${{ inputs.wayback_sleep }}" \
            --commit-every 5
