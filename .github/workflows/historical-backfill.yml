name: Historical Data Backfill

# Max densify: seed DMT/policy, import Kaggle SL CSV, Wayback (ikman brands/models
# + riyasewana), then Common Crawl densify. Writes ONLY to
# historical_price_observations / market_signals — never live car_listings.
#
# Trigger: Actions → Historical Data Backfill → Run workflow
# Also runs automatically on push to main when historical backfill code changes.

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Seed DMT + policy market_signals"
        type: boolean
        default: true
      run_csv_import:
        description: "Import Kaggle SL CSV into historical_price_observations"
        type: boolean
        default: true
      run_wayback:
        description: "Max Wayback backfill (ikman brands/models + riyasewana)"
        type: boolean
        default: true
      run_common_crawl:
        description: "Common Crawl densify for ikman SERPs"
        type: boolean
        default: true
      wayback_max_snapshots:
        description: "Max Wayback snapshots (year-balanced)"
        type: number
        default: 300
      wayback_sleep:
        description: "Seconds between Wayback fetches"
        type: number
        default: 1.5
      cc_max_records:
        description: "Max Common Crawl WARC records to fetch"
        type: number
        default: 100
  push:
    branches: [main]
    paths:
      - "backend/app/services/historical_archive.py"
      - "backend/app/services/common_crawl_archive.py"
      - "backend/scripts/ops/backfill_wayback_prices.py"
      - "backend/scripts/ops/backfill_common_crawl_prices.py"
      - "backend/data/historical/**"
      - ".github/workflows/historical-backfill.yml"

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      RUN_SEED: ${{ github.event_name == 'push' && 'true' || inputs.run_seed }}
      RUN_CSV: ${{ github.event_name == 'push' && 'true' || inputs.run_csv_import }}
      RUN_WAYBACK: ${{ github.event_name == 'push' && 'true' || inputs.run_wayback }}
      RUN_CC: ${{ github.event_name == 'push' && 'true' || inputs.run_common_crawl }}
      WAYBACK_MAX: ${{ github.event_name == 'push' && '300' || inputs.wayback_max_snapshots }}
      WAYBACK_SLEEP: ${{ github.event_name == 'push' && '1.5' || inputs.wayback_sleep }}
      CC_MAX: ${{ github.event_name == 'push' && '100' || inputs.cc_max_records }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure schema
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python - <<'PY'
          from db.session import init_db
          init_db()
          print("schema_ok")
          PY

      - name: Seed DMT + policy context
        if: ${{ env.RUN_SEED == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python scripts/ops/seed_market_context.py

      - name: Import Kaggle SL CSV → historical_price_observations only
        if: ${{ env.RUN_CSV == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          test -f data/historical/kaggle_sl_car_price_dataset.csv
          wc -l data/historical/kaggle_sl_car_price_dataset.csv
          python scripts/ops/import_historical_csv.py \
            data/historical/kaggle_sl_car_price_dataset.csv \
            --archive-source kaggle_sl \
            --price-unit lakhs \
            --observed-default 2025-01-15

      - name: Wayback max densify (ikman + riyasewana)
        if: ${{ env.RUN_WAYBACK == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python scripts/ops/backfill_wayback_prices.py \
            --profile max \
            --from 20100101 \
            --to 20261231 \
            --max-snapshots "${WAYBACK_MAX}" \
            --sleep "${WAYBACK_SLEEP}"

      - name: Common Crawl densify
        if: ${{ env.RUN_CC == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python scripts/ops/backfill_common_crawl_prices.py \
            --max-records "${CC_MAX}" \
            --crawl-limit 10 \
            --sleep 1.0
