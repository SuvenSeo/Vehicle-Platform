name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No sdkmanager found under $ANDROID_HOME; relying on runner defaults"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Resolve sideload keystore
        working-directory: .
        run: |
          set -euo pipefail
          # Signing identity (highest priority first):
          # 1. ANDROID_KEYSTORE_FILE secret (a real, private release identity) — write it
          #    to the Gradle-expected debug-keystore path so the build picks it up without
          #    any gradle change.
          # 2. The committed android/ci-signing.keystore — legacy shared dev identity,
          #    kept only so today's in-place updates keep working; rotate away from it.
          # In all cases the same signature must ship every release: a new signature
          # blocks in-place upgrades — do not reintroduce per-run key generation.
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_FILE" | base64 --decode > "$KEYSTORE"
            echo "Using ANDROID_KEYSTORE_FILE secret for sideload signing."
          elif [ -f android/ci-signing.keystore ]; then
            echo "WARNING: using the committed ci-signing.keystore (public, shared dev identity)."
            echo "Migrate to ANDROID_KEYSTORE_FILE; see docs/ANDROID_SIGNING.md."
          else
            echo "ERROR: no sideload identity — set the ANDROID_KEYSTORE_FILE secret or restore android/ci-signing.keystore"
            exit 1
          fi

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motormila-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
