# Neon-first: scrapers WRITE to NeonDB (ingress is free). Stats-only snapshot
# export keeps dashboards fresh without a full-catalog read (egress control).
name: Midday Top Sources Scraper

on:
  schedule:
    # 12:00 Sri Lanka time = 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

# Separate from the full daily scrape so midday never cancels (or is cancelled by) it.
concurrency:
  group: scrape-midday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-source:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [ikman, riyasewana]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/ikman.py \
            app/scrapers/riyasewana.py

      - name: Ensure schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        continue-on-error: ${{ matrix.source == 'riyasewana' }}
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          SCRAPE_MAX_PAGES: "30"
          SCRAPE_MAX_PAGES_IKMAN: "30"
          SCRAPE_MAX_PAGES_RIYASEWANA: "30"
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "3600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_IKMAN: "3600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "3600"
          RIYASEWANA_ARCHIVE_FALLBACK: "0"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: midday-scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' (${{ matrix.source }}) failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  market-analysis:
    runs-on: ubuntu-latest
    needs: scrape-source
    if: ${{ always() && !cancelled() }}
    # First pass after a migration/dedup rebuild is heavy (deal scores,
    # lifecycle, outlier, thumbnail/phash backfill over the full table).
    timeout-minutes: 180

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market analysis once
        # Midday is intentionally analysis-light: the heavy full-table stages
        # (aggregates, deal scores, outliers, price recovery, alert match,
        # thumbnail/phash backfill) run once on the daily 03:00 UTC job. Keeping
        # only the cheap passes here halves Neon public-network transfer (the
        # 5 GB/mo free cap was 80% used) without stalling the pipeline.
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_DEAL_SCORE_REFRESH: "false"
          RUN_STATS_CACHE_REFRESH: "true"
          RUN_DEDUP: "true"
          RUN_LISTING_LIFECYCLE: "true"
          RUN_OUTLIER_DETECTION: "false"
          RUN_PRICE_RECOVERY: "false"
          RUN_ALERT_MATCH: "false"
          RUN_THUMBNAIL_CACHE: "false"
          RUN_IMAGE_PHASH: "false"
        run: python run_sync.py

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  snapshot-export:
    runs-on: ubuntu-latest
    needs: [scrape-source, market-analysis]
    if: ${{ always() && !cancelled() && needs.market-analysis.result == 'success' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Export public snapshots (stats-only — catalog refreshes weekly)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python export_public_snapshots.py --output snapshots/latest --skip-catalog

      - name: Upload snapshots to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: snapshots/latest
        run: python upload_snapshots_r2.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy snapshots to Vercel production
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: backend/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: midday-public-snapshot-manifest-${{ github.run_id }}
          path: backend/snapshots/latest/manifest.json
          retention-days: 14

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"
