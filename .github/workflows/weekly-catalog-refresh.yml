# Full-Catalog Snapshot Refresh (Every 3 Days)
#
# Rebuilds listing-catalog.json (+ 40MB part chunks + models) from the DB and
# uploads to R2/Vercel every 3 days so the public site's listings stay fresh.
# Egress cost: ~80 MB per run x 10 runs/month = ~800 MB/month.
#
# Runs: Every 3 days at 03:00 UTC.
# Manual: Actions → "Full-Catalog Snapshot Refresh (Every 3 Days)" → Run workflow.

name: Full-Catalog Snapshot Refresh (Every 3 Days)

# Quota-aware instead of paused: the schedule re-enabled, but the export is
# SKIPPED (not failed) when Neon is blocked or the egress watchdog reports
# warning/over budget. Stale catalog beats dead database.

on:
  schedule:
    - cron: "0 3 */3 * *"   # Every 3 days at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: catalog-refresh-scheduled
  cancel-in-progress: false

jobs:
  neon-guard:
    name: Skip when Neon transfer quota is exhausted
    uses: ./.github/workflows/probe-neon.yml
    secrets: inherit

  egress-guard:
    name: Skip when egress budget is tight
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    outputs:
      safe: ${{ steps.egress.outputs.safe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Neon data transfer budget
        id: egress
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          NEON_TRANSFER_BUDGET_GB: "5"
          NEON_WARN_FRACTION: "0.7"
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          set -euo pipefail
          # 0=under budget, 1=over, 2=warning, 3=could not check.
          set +e
          python scripts/ops/check_neon_egress.py
          code=$?
          set -e
          case "$code" in
            0|3) echo "safe=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "safe=false" >> "$GITHUB_OUTPUT"
                 echo "::warning::Neon egress budget tight (exit ${code}) — skipping catalog refresh." ;;
          esac

  export-catalog:
    needs: [neon-guard, egress-guard]
    if: ${{ needs.neon-guard.outputs.available == 'true' && needs.egress-guard.outputs.safe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Export public snapshots (FULL catalog)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python export_public_snapshots.py --output snapshots/latest

      - name: Upload snapshots to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: snapshots/latest
        run: python upload_snapshots_r2.py

      - name: Upload manifest artifact (fallback for manual redeploy)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-catalog-snapshots-${{ github.run_id }}
          path: backend/snapshots/latest/
          retention-days: 7
          if-no-files-found: error

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy snapshots to Vercel production
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: backend/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Weekly full-catalog snapshot refresh failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"
