# Neon-first: pg_dump pulls the WHOLE database through Neon egress, so this
# runs WEEKLY (not daily) to stay inside the free transfer allowance. Neon's
# built-in PITR/branch history covers day-to-day recovery. Public browsing
# reads R2 snapshots, not this dump.
#
# Quota-aware: the dump is skipped (not failed) when Neon is blocked or when
# the egress watchdog reports warning/over budget. Backups must never be the
# thing that exhausts the transfer quota and takes the live DB offline.
name: Weekly DB Backup

on:
  schedule:
    - cron: "30 2 * * 0"   # Weekly, Sunday 02:30 UTC (after the 1st-of-month quota reset)
  workflow_dispatch:

# Never two dumps at once; a running dump is never cancelled by a new dispatch.
concurrency:
  group: db-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  neon-guard:
    name: Skip when Neon transfer quota is exhausted
    uses: ./.github/workflows/probe-neon.yml
    secrets: inherit

  egress-guard:
    name: Skip when egress budget is tight
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    outputs:
      safe: ${{ steps.egress.outputs.safe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Neon data transfer budget
        id: egress
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          NEON_TRANSFER_BUDGET_GB: "5"
          NEON_WARN_FRACTION: "0.7"
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          set -euo pipefail
          # 0=under budget, 1=over, 2=warning, 3=could not check.
          set +e
          python scripts/ops/check_neon_egress.py
          code=$?
          set -e
          case "$code" in
            0|3) echo "safe=true"  >> "$GITHUB_OUTPUT" ;;   # proceed (unknown = old behavior)
            *)   echo "safe=false" >> "$GITHUB_OUTPUT"
                 echo "::warning::Neon egress budget tight (exit ${code}) — skipping weekly dump." ;;
          esac

  backup:
    name: pg_dump → artifact
    needs: [neon-guard, egress-guard]
    if: ${{ needs.neon-guard.outputs.available == 'true' && needs.egress-guard.outputs.safe == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check database secret
        id: check-secret
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          if [ -z "$HOT_DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No database URL secret configured — skipping backup."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Neon runs PostgreSQL 17; the distro postgresql-client (16 on
      # ubuntu-24.04) aborts with a server version mismatch, so install
      # client 17 from the official PGDG repo.
      - name: Install postgresql-client-17
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run pg_dump
        if: steps.check-secret.outputs.skip == 'false'
        id: dump
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          # PGDG installs pg_dump 17 to /usr/lib/postgresql/17/bin, which is NOT
          # on PATH — the runner image's pg_dump 16 would otherwise run and abort
          # with "server version mismatch" against Neon's PostgreSQL 17.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          DATABASE_URL="${HOT_DATABASE_URL}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          FILENAME="motormila-backup-${TIMESTAMP}.dump"
          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"
          pg_dump \
            --no-owner \
            --no-privileges \
            --format=custom \
            --compress=9 \
            --dbname="$DATABASE_URL" \
            --file="${FILENAME}"
          echo "Backup written to ${FILENAME} ($(du -sh "${FILENAME}" | cut -f1))"

      - name: Upload backup artifact
        if: steps.check-secret.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Notify Slack on failure
        if: failure() && steps.check-secret.outputs.skip == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":x: *Motormila weekly DB backup failed*\nWorkflow: <${RUN_URL}|View run>\"}"
