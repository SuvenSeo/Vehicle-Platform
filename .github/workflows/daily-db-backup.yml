# SCHEDULE PAUSED 2026-07-30 — Supabase free egress exceeded.
# Full pg_dump pulls the DB through Supabase egress; re-enable after R2/egress recovery
# (snapshot-only mode). Manual workflow_dispatch only until then.
name: Daily DB Backup

on:
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check database secret
        id: check-secret
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$HOT_DATABASE_URL" ] && [ -z "$SUPABASE_DB_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No database URL secret configured — skipping backup."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run pg_dump
        if: steps.check-secret.outputs.skip == 'false'
        id: dump
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATABASE_URL="${HOT_DATABASE_URL:-$SUPABASE_DB_URL}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          FILENAME="motormila-backup-${TIMESTAMP}.dump"
          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"
          pg_dump \
            --no-owner \
            --no-privileges \
            --format=custom \
            --compress=9 \
            --dbname="$DATABASE_URL" \
            --file="${FILENAME}"
          echo "Backup written to ${FILENAME} ($(du -sh "${FILENAME}" | cut -f1))"

      - name: Upload backup artifact
        if: steps.check-secret.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Notify Slack on failure
        if: failure() && steps.check-secret.outputs.skip == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":x: *Motormila daily DB backup failed*\nWorkflow: <${RUN_URL}|View run>\"}"
