# Neon-first: pg_dump pulls the WHOLE database through Neon egress, so this
# runs WEEKLY (not daily) to stay inside the free transfer allowance. Neon's
# built-in PITR/branch history covers day-to-day recovery. Public browsing
# reads R2 snapshots, not this dump.
name: Weekly DB Backup

on:
  schedule:
    - cron: "30 2 * * 0"   # Sunday 02:30 UTC
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check database secret
        id: check-secret
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          if [ -z "$HOT_DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No database URL secret configured — skipping backup."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Neon runs PostgreSQL 17; the distro postgresql-client (16 on
      # ubuntu-24.04) aborts with a server version mismatch, so install
      # client 17 from the official PGDG repo.
      - name: Install postgresql-client-17
        if: steps.check-secret.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run pg_dump
        if: steps.check-secret.outputs.skip == 'false'
        id: dump
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          DATABASE_URL="${HOT_DATABASE_URL}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          FILENAME="motormila-backup-${TIMESTAMP}.dump"
          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"
          pg_dump \
            --no-owner \
            --no-privileges \
            --format=custom \
            --compress=9 \
            --dbname="$DATABASE_URL" \
            --file="${FILENAME}"
          echo "Backup written to ${FILENAME} ($(du -sh "${FILENAME}" | cut -f1))"

      - name: Upload backup artifact
        if: steps.check-secret.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Notify Slack on failure
        if: failure() && steps.check-secret.outputs.skip == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":x: *Motormila weekly DB backup failed*\nWorkflow: <${RUN_URL}|View run>\"}"
