name: Rescue Neon Export

on:
  workflow_dispatch:

jobs:
  export-neon-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Neon data
        env:
          SOURCE_DATABASE_URL: ${{ secrets.COLD_DATABASE_URL }}
        run: python rescue_postgres_data.py export --output rescue_exports/neon-export

      - name: Upload rescue export
        uses: actions/upload-artifact@v4
        with:
          name: neon-rescue-export-${{ github.run_id }}
          path: backend/rescue_exports/neon-export
          retention-days: 14
